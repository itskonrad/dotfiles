"$schema" = 'https://starship.rs/config-schema.json'

# /mnt/c (Windows drives) is slow over WSL's 9P mount; defaults are 30ms / 500ms
scan_timeout = 200
command_timeout = 1000

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$python\
$character"""

[directory]
style = "blue"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style)"
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
# non-empty but invisible so the * shows; zero-width spaces desync fish's cursor
conflicted = "\u001b\\[39m"
untracked = "\u001b\\[39m"
modified = "\u001b\\[39m"
staged = "\u001b\\[39m"
renamed = "\u001b\\[39m"
deleted = "\u001b\\[39m"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
detect_extensions = []
detect_files = []
