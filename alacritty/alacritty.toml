[general]
import = ["themes/vesper.toml"]

[colors.primary]
foreground = "#c8c8c8"

[env]
TERM = "xterm-256color"
COLORTERM = "truecolor"

[window]
dimensions = { columns = 124, lines = 36 }
padding = { x = 10, y = 8 }
dynamic_padding = true
opacity = 0.97
title = "WSL · Ubuntu 24.04"
decorations_theme_variant = "Dark"

[scrolling]
history = 50000

[font]
normal = { family = "Geist Mono", style = "Regular" }
bold = { family = "Geist Mono", style = "Bold" }
italic = { family = "Geist Mono", style = "Italic" }
bold_italic = { family = "Geist Mono", style = "Bold Italic" }
size = 11
offset = { x = 0, y = 1 }

[cursor]
style = { shape = "Beam", blinking = "On" }
vi_mode_style = { shape = "Block", blinking = "Off" }
blink_interval = 500
blink_timeout = 0

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

[[mouse.bindings]]
mouse = "Left"
action = "PasteSelection"

[terminal]
osc52 = "CopyPaste"

[terminal.shell]
program = "C:\\Windows\\System32\\wsl.exe"
args = [
  "--distribution", "Ubuntu-24.04",
  "--cd", "~",
  "--exec", "/usr/bin/fish", "--login",
]

[[keyboard.bindings]]
key = "F11"
action = "ToggleFullscreen"

[[keyboard.bindings]]
key = "N"
mods = "Control|Shift"
action = "CreateNewWindow"
